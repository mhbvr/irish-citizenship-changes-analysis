name: Build PDF

# Rebuilds citizenship-analysis.pdf (the submission document) whenever the
# pages or the summary change on main, and commits it back if the result differs.
# The build is reproducible: the same sources give the same file.
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "summary.md"
      - "scripts/build_pdf.py"
      - ".github/workflows/pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Carlito font and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-crosextra-carlito
          pip install reportlab==5.0.1 beautifulsoup4==4.15.0
      - name: Build PDF
        run: python3 scripts/build_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: citizenship-analysis-pdf
          path: citizenship-analysis.pdf
      - name: Commit PDF if changed
        run: |
          if git diff --quiet -- citizenship-analysis.pdf && git ls-files --error-unmatch citizenship-analysis.pdf >/dev/null 2>&1; then
            echo "PDF unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add citizenship-analysis.pdf
          git commit -m "Rebuild PDF"
          git push
